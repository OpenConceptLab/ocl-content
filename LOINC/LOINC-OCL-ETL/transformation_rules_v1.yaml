# LOINC to OCL Transformation Rules - Version 1 (Updated)
# This file defines the business logic for transforming LOINC data into OCL objects
# Updated to use Code Types for concept_class and SCALE_TYP for datatype

version: v1.1
target_loinc_version: '2.80'
created_date: '2025-08-05'
description: 'Updated transformation rules with Code Types and Data Types for LOINC 2.80 to OCL conversion'

# Status Field Mappings (From LOINC Model Requirements)
# Maps LOINC STATUS values to OCL retired field
# Decision: Only "DEPRECATED" maps to retired=true
status_mappings:
  retired_false:
    - 'ACTIVE'
    - 'TRIAL' 
    - 'DISCOURAGED'
  retired_true:
    - 'DEPRECATED'

# Code Type Mappings (UPDATED)
# Maps entity types to standardized Code Types for concept_class field
code_type_mappings:
  loinc_terms: 'LOINC'              # For LOINC Terms from Loinc.csv
  loinc_parts: 'LOINC Part'         # For Parts from Part.csv  
  answer_lists: 'Answer List'       # For Answer Lists from AnswerList.csv (LL codes)
  loinc_answers: 'LOINC Answer'     # For LOINC Answers from AnswerList.csv (LA codes)
  containers: 'Misc'                # For Container Concepts

# Data Type Mappings (UPDATED)
# Maps to LOINC SCALE_TYP field when available, otherwise "N/A"
datatype_mappings:
  loinc_terms:
    source_field: 'SCALE_TYP'       # Use SCALE_TYP field from LOINC Terms
    fallback: 'N/A'                 # If SCALE_TYP is empty/missing
  loinc_parts:
    source_field: null              # Parts don't have SCALE_TYP
    fallback: 'N/A'                 # Always N/A for parts
  answer_lists:
    source_field: null              # Answer Lists don't have SCALE_TYP  
    fallback: 'N/A'                 # Always N/A for answer lists
  loinc_answers:
    source_field: null              # LOINC Answers don't have SCALE_TYP
    fallback: 'N/A'                 # Always N/A for LOINC answers
  containers:
    source_field: null              # Containers don't have SCALE_TYP
    fallback: 'N/A'                 # Always N/A for containers

# Container Concepts for Orphaned Items
# These containers will hold parts/concepts that don't have clear hierarchical parents
container_concepts:
  - id: 'LOINC_COMPONENT'
    name: 'LOINC Component'
    description: 'Component parts without clear hierarchy'
    concept_class: 'Misc'
    
  - id: 'LOINC_PROPERTY'
    name: 'LOINC Property'
    description: 'Property parts without clear hierarchy'
    concept_class: 'Misc'
    
  - id: 'LOINC_TIME'
    name: 'LOINC Time'
    description: 'Time aspects without clear hierarchy' 
    concept_class: 'Misc'
    
  - id: 'LOINC_SYSTEM'
    name: 'LOINC System'
    description: 'System parts without clear hierarchy'
    concept_class: 'Misc'
    
  - id: 'LOINC_SCALE'
    name: 'LOINC Scale'
    description: 'Scale types without clear hierarchy'
    concept_class: 'Misc'
    
  - id: 'LOINC_METHOD'
    name: 'LOINC Method'
    description: 'Method parts without clear hierarchy'
    concept_class: 'Misc'
    
  - id: 'OTHER'
    name: 'Other'
    description: 'Uncategorized parts and concepts'
    concept_class: 'Misc'

# LOINC Term Mappings (UPDATED)
# Defines how LOINC.csv fields map to OCL concept fields
loinc_term_mappings:
  # Core OCL fields
  id: 'LOINC_NUM'                    # OCL concept ID
  display_name: 'LONG_COMMON_NAME'   # Primary display name (always filled)
  concept_class: 'LOINC'             # Use Code Type instead of CLASS field
  datatype: 'SCALE_TYP'              # Use SCALE_TYP field for datatype
  retired: 'STATUS'                  # Use status_mappings for boolean conversion
  external_id: 'LOINC_NUM'           # Preserve original LOINC number
  
  # Names array (multiple name variants)
  names:
    primary_name: 'LONG_COMMON_NAME'       # Always present, fully specified
    short_name: 'SHORTNAME'                # Optional, shorter version
    display_name: 'DISPLAY_NAME'           # Optional, from some LOINC files
    consumer_name: 'CONSUMER_NAME'         # Consumer-friendly name (future)
  
  # OCL extras (additional LOINC-specific data)
  extras:
    class: 'CLASS'                         # Original LOINC class (moved to extras)
    component: 'COMPONENT'                 # What is measured/observed
    property: 'PROPERTY'                   # How it's measured (mass, volume, etc.)
    time_aspect: 'TIME_ASPCT'              # Point in time vs. period
    system: 'SYSTEM'                       # Specimen/system type
    scale_type: 'SCALE_TYP'                # Scale of measurement (also in datatype)
    method_type: 'METHOD_TYP'              # Method of measurement
    common_test_rank: 'COMMON_TEST_RANK'   # Usage frequency ranking
    common_order_rank: 'COMMON_ORDER_RANK' # Order frequency ranking
    common_si_test_rank: 'COMMON_SI_TEST_RANK' # SI unit ranking
    definition_description: 'DefinitionDescription'  # Extended definition
    example_units: 'EXAMPLE_UNITS'         # Example units
    example_si_ucum_units: 'EXAMPLE_SI_UCUM_UNITS'  # SI/UCUM units
    status: 'STATUS'                       # LOINC status (ACTIVE, DEPRECATED, etc.)
    
# Part Mappings (UPDATED)
# Defines how Part.csv fields map to OCL concept fields
part_mappings:
  # Core OCL fields  
  id: 'PartNumber'                   # Part number (e.g., "LP12345-6")
  display_name: 'PartDisplayName'    # Primary display name
  concept_class: 'LOINC Part'        # Use Code Type instead of PartTypeName
  datatype: 'N/A'                    # Always N/A for parts
  retired: 'Status'                  # Use status_mappings for boolean conversion
  external_id: 'PartNumber'          # Preserve original part number
  
  # Names array
  names:
    primary_name: 'PartDisplayName'        # Main display name
    part_name: 'PartName'                  # Alternative name (if different)
    
  # OCL extras (Part-specific data)
  extras:
    part_number: 'PartNumber'              # LP code
    part_type: 'PartTypeName'              # Original type classification (moved to extras)
    status: 'Status'                       # ACTIVE, DEPRECATED, etc.
    created_on: 'CreatedOn'                # Creation date
    modified_on: 'ModifiedOn'              # Last modification date

# Answer List Mappings (UPDATED)
# Defines how AnswerList.csv fields map to OCL concept fields for Answer Lists (LL codes)
# NOTE: AnswerList.csv contains BOTH Answer Lists (LL) AND LOINC Answers (LA) in the same file
# Rows with AnswerListId populated = Answer List concepts
# Rows with AnswerStringId populated = LOINC Answer concepts
answer_list_mappings:
  # Core OCL fields
  id: 'AnswerListId'                 # Answer list ID (e.g., "LL123-4")
  display_name: 'AnswerListName'     # Answer list name
  concept_class: 'Answer List'       # Keep as Code Type
  datatype: 'N/A'                    # Always N/A for answer lists
  retired: false                     # Always active for answer lists
  external_id: 'AnswerListId'        # Preserve original answer list ID
  
  # Names array
  names:
    primary_name: 'AnswerListName'         # Display name for the list
    
  # OCL extras (Answer List-specific data)
  extras:
    answer_list_id: 'AnswerListId'         # LL code
    answer_list_oid: 'AnswerListOID'       # Object identifier
    externally_defined: 'ExtDefinedYN'     # Y/N flag
    external_code_system: 'ExtDefinedAnswerListCodeSystem'  # External system
    external_link: 'ExtDefinedAnswerListLink'  # External reference URL
    anchored_to: 'AnchoredTo'              # What this list is anchored to

# LOINC Answer Mappings (NEW - LA Codes)
# Individual LOINC Answer concepts from AnswerList.csv
# These are the "LA" codes that represent specific answer options
loinc_answer_mappings:
  # Core OCL fields
  id: 'AnswerStringId'               # Answer ID (e.g., "LA123-4") 
  display_name: 'DisplayText'        # Answer display text
  concept_class: 'LOINC Answer'      # Code Type for LOINC answers
  datatype: 'N/A'                    # Always N/A for answers
  retired: false                     # Default active
  external_id: 'AnswerStringId'      # Preserve original answer ID
  
  # Names array
  names:
    primary_name: 'DisplayText'            # Main display text
    
  # OCL extras (LOINC Answer-specific data)
  extras:
    answer_string_id: 'AnswerStringId'     # LA code
    answer_list_id: 'AnswerListId'         # Parent list (LL code)
    sequence_number: 'SequenceNumber'      # Order within list
    local_answer_code: 'LocalAnswerCode'   # Local code/label
    local_code_system: 'LocalAnswerCodeSystem' # Local code system
    external_code_id: 'ExtCodeId'          # External terminology code
    external_code_display: 'ExtCodeDisplayName' # External code display
    external_code_system: 'ExtCodeSystem'  # External code system
    external_code_version: 'ExtCodeSystemVersion' # External version
    score: 'Score'                         # Numeric score (if applicable)
    description: 'Description'             # Answer description
    subsequent_text_prompt: 'SubsequentTextPrompt' # Additional prompt text

# Quality Control Rules
quality_rules:
  # Concept Class validation
  valid_concept_classes:
    - 'LOINC'           # For LOINC Terms
    - 'LOINC Part'      # For LOINC Parts  
    - 'Answer List'     # For Answer Lists (LL codes)
    - 'LOINC Answer'    # For LOINC Answers (LA codes)
    - 'Misc'            # For Containers
  
  # Data Type validation
  valid_datatypes:
    - 'Qn'              # Quantitative
    - 'Ord'             # Ordinal
    - 'Nom'             # Nominal
    - 'Nar'             # Narrative
    - 'Multi'           # Multiple choice
    - 'Doc'             # Document
    - 'Set'             # Set
    - 'N/A'             # Not applicable
  
  # Required fields per entity type
  required_fields:
    loinc_terms: ['LOINC_NUM', 'LONG_COMMON_NAME', 'CLASS', 'STATUS']
    loinc_parts: ['PartNumber', 'PartDisplayName', 'PartTypeName', 'Status']
    answer_lists: ['AnswerListId', 'AnswerListName']
    loinc_answers: ['AnswerStringId', 'DisplayText', 'AnswerListId']  # Required fields for LA codes
    
  # Validation thresholds
  thresholds:
    min_name_length: 2
    max_name_length: 500
    max_description_length: 2000