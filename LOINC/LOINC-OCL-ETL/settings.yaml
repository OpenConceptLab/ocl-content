# LOINC to OCL Transformation Settings
# Updated with Phase 2 dataset discovery configuration

# Processing configuration
processing:
  batch_sizes:
    data_loading: 1000
    concept_creation: 1000
    mapping_creation: 500
    validation: 1000
  
  # Performance settings
  performance:
    max_memory_gb: 4
    max_processing_time_seconds: 30
    enable_progress_tracking: true
    progress_update_interval: 1000

# Dataset discovery configuration (NEW)
dataset_discovery:
  # Size thresholds for automatic dataset identification
  size_thresholds:
    loinc_terms:
      min_records: 50000
      max_records: 200000
      expected_records: 104672
    loinc_parts:
      min_records: 10000
      max_records: 100000
      expected_records: 72740
    answer_lists:
      min_records: 1000
      max_records: 50000
      expected_records: 30315
    language_variants:
      min_records: 100
      max_records: 200000
      expected_records: 10000  # varies by language
  
  # Dataset identification patterns
  identification_patterns:
    loinc_terms:
      preferred_names: ["Loinc.csv", "loinc_terms", "loinc", "loinc_table"]
      required_columns: ["LOINC_NUM", "LONG_COMMON_NAME"]
      exclude_patterns: ["part", "answer", "link", "linguistic"]
    loinc_parts:
      preferred_names: ["Part.csv", "loinc_parts", "parts"]
      required_columns: ["PartNumber", "PartDisplayName"]
      exclude_patterns: ["link", "supplementary", "primary"]
    answer_lists:
      preferred_names: ["AnswerList.csv", "answer_lists", "answerlist"]
      required_columns: ["AnswerListId", "AnswerListName"]
      exclude_patterns: ["link", "string"]
  
  # Discovery behavior
  behavior:
    enable_caching: true
    cache_ttl_seconds: 3600  # 1 hour
    fallback_to_size_matching: true
    strict_column_validation: false
    log_discovery_details: true

# File paths and directories
paths:
  # Input directories
  loinc_data_dir: "data/loinc"
  language_variants_dir: "data/loinc/LinguisticVariants"
  config_dir: "config"
  
  # Output directories  
  output_dir: "output"
  logs_dir: "logs"
  temp_dir: "temp"
  reports_dir: "output/reports"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_logging: true
  console_logging: true
  max_log_size_mb: 100
  backup_count: 5

# OCL-specific settings
ocl:
  # OCL concept defaults
  defaults:
    owner_type: "Organization"
    source: "LOINC"
    datatype: "None"
    concept_class_fallback: "Laboratory"
  
  # Validation settings
  validation:
    strict_mode: true
    enable_schema_validation: true
    max_name_length: 1000
    required_locales: ["en"]
    warn_on_missing_translations: true

# Quality assurance
quality:
  validation:
    enable_cross_validation: true
    require_english_names: true
    allow_duplicate_ids: false
    max_validation_errors: 0
  
  performance:
    benchmark_against_phase1: true
    require_sub_30_second_processing: true
    max_memory_usage_gb: 4
    min_concepts_per_second: 1000

# Multi-language support
languages:
  supported_locales:
    - "en"  # English (primary)
    - "fr"  # French
    - "es"  # Spanish
    - "de"  # German
    - "it"  # Italian
    - "pt"  # Portuguese
    - "nl"  # Dutch
    - "ru"  # Russian
    - "zh"  # Chinese
    - "ja"  # Japanese
    - "ko"  # Korean
    - "ar"  # Arabic
    - "hi"  # Hindi
    - "sv"  # Swedish
    - "da"  # Danish
    - "no"  # Norwegian
    - "fi"  # Finnish
    - "pl"  # Polish
    - "cs"  # Czech
  
  processing:
    auto_detect_language_files: true
    preserve_unicode: true
    normalize_locale_codes: true
    fallback_to_english: true