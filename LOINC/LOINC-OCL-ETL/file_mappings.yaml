# LOINC File Mappings and Validation Rules
# This file defines the expected structure and validation rules for each LOINC input file

# Main LOINC Files (Phase 1 Scope)
loinc_files:
  
  # Main LOINC Terms Table
  'Loinc.csv':
    description: 'Main LOINC terms table with ~104,000 laboratory tests and clinical observations'
    required: true
    priority: 1
    key_field: 'LOINC_NUM'
    
    # Expected core columns (subset of full schema)
    expected_columns:
      - 'LOINC_NUM'           # Primary identifier (e.g., "1234-5")
      - 'LONG_COMMON_NAME'    # Primary display name
      - 'SHORTNAME'           # Short display name
      - 'STATUS'              # ACTIVE, TRIAL, DISCOURAGED, DEPRECATED
      - 'COMPONENT'           # What is measured/observed
      - 'PROPERTY'            # Property observed
      - 'TIME_ASPCT'          # Time aspect
      - 'SYSTEM'              # Specimen/system
      - 'SCALE_TYP'           # Scale of measurement
      - 'METHOD_TYP'          # Method of observation
      - 'CLASS'               # LOINC class
      - 'AnswerListId'        # Reference to answer list (if applicable)
      - 'AssociatedObservations' # Related observations
      - 'VersionFirstReleased' # First release version
      - 'VersionLastChanged'   # Last change version
      
    # Data validation rules
    validation_rules:
      primary_key: 'LOINC_NUM'
      required_fields: ['LOINC_NUM', 'LONG_COMMON_NAME', 'STATUS']
      format_patterns:
        'LOINC_NUM': '^\\d{1,5}-\\d{1,2}$'
      allowed_values:
        'STATUS': ['ACTIVE', 'TRIAL', 'DISCOURAGED', 'DEPRECATED']
        
    # Estimated statistics
    expected_row_count: 104000
    expected_size_mb: 25
    
  # LOINC Parts/Components  
  'Part.csv':
    description: 'LOINC parts (components, properties, systems, etc.) with ~40,000 entries'
    required: true
    priority: 2
    key_field: 'PartNumber'
    
    expected_columns:
      - 'PartNumber'          # Primary identifier (e.g., "LP12345-6")
      - 'PartDisplayName'     # Primary display name
      - 'PartName'            # Alternative name (fallback)
      - 'PartTypeName'        # Type of part (COMPONENT, PROPERTY, etc.)
      - 'STATUS'              # Status of the part
      - 'CreatedOn'           # Creation date
      - 'ModifiedOn'          # Last modification date
      
    validation_rules:
      primary_key: 'PartNumber'
      required_fields: ['PartNumber', 'PartDisplayName', 'PartTypeName']
      format_patterns:
        'PartNumber': '^LP\\d+(-\\d+)?$'
      allowed_values:
        'PartTypeName': ['COMPONENT', 'PROPERTY', 'TIME_ASPCT', 'SYSTEM', 'SCALE_TYP', 'METHOD_TYP', 'CLASS']
        
    expected_row_count: 40000
    expected_size_mb: 8
    
  # Answer Lists
  'AnswerList.csv':
    description: 'Standardized answer lists for LOINC terms'
    required: true  
    priority: 3
    key_field: 'AnswerListId'
    
    expected_columns:
      - 'AnswerListId'        # Primary identifier (e.g., "LL123-4")
      - 'AnswerListName'      # Display name of answer list
      - 'AnswerListOID'       # Object identifier
      - 'ExtDefinedYN'        # Externally defined flag
      - 'ExtDefinedAnswerListCodeSystem' # External code system
      - 'ExtDefinedAnswerListLink' # External link
      - 'AnswerStringType'    # Type of answer strings
      - 'AnchoredTo'          # What the list is anchored to
      
    validation_rules:
      primary_key: 'AnswerListId'
      required_fields: ['AnswerListId', 'AnswerListName']
      format_patterns:
        'AnswerListId': '^LL\\d+-\\d+$'
        
    expected_row_count: 1200
    expected_size_mb: 1

  # Individual Answers (from AnswerList table or similar)
  'AnswerList.csv':
    description: 'Individual answer options within answer lists'
    required: false  # May be embedded in other files
    priority: 4
    key_field: 'AnswerStringId'
    
    expected_columns:
      - 'AnswerListId'        # Parent answer list
      - 'AnswerStringId'      # Primary identifier (e.g., "LA123-4")
      - 'SequenceNumber'      # Order within list
      - 'DisplayText'         # Display text for answer
      - 'AnswerCode'          # Code value
      - 'Score'               # Numeric score (if applicable)
      
    validation_rules:
      primary_key: 'AnswerStringId'
      required_fields: ['AnswerListId', 'AnswerStringId', 'DisplayText']
      format_patterns:
        'AnswerStringId': '^LA\\d+-\\d+$'
        'AnswerListId': '^LL\\d+-\\d+$'
        
    expected_row_count: 35000
    expected_size_mb: 5

  # LOINC Answer List Links
  'LoincAnswerListLink.csv':
    description: 'Links between LOINC terms and their answer lists'
    required: false
    priority: 5
    
    expected_columns:
      - 'LOINC_NUM'           # LOINC code
      - 'AnswerListId'        # Answer list identifier  
      - 'AnswerListName'      # Answer list name
      - 'ExtCodeId'           # External code ID
      - 'ExtCodeDisplayName'  # External code display name
      - 'ExtCodeSystem'       # External code system
      - 'ExtCodeSystemVersion' # External code system version
      
    foreign_keys:
      'LOINC_NUM': 'Loinc.csv.LOINC_NUM'
      'AnswerListId': 'AnswerList.csv.AnswerListId'

  # Panels and Forms
  'PanelsAndForms.csv':
    description: 'Panel structures and form relationships'
    required: false
    priority: 6
    
    expected_columns:
      - 'ParentLoinc'         # Parent LOINC code
      - 'ParentName'          # Parent name
      - 'ParentType'          # Type of parent (Panel, Form, etc.)
      - 'ChildLoinc'          # Child LOINC code
      - 'ChildName'           # Child name
      - 'SequenceNumber'      # Order within panel
      
    foreign_keys:
      'ParentLoinc': 'Loinc.csv.LOINC_NUM'
      'ChildLoinc': 'Loinc.csv.LOINC_NUM'

  # Code Evolution Mappings
  'MapTo.csv':
    description: 'Mappings from deprecated codes to current codes'
    required: false
    priority: 7
    
    expected_columns:
      - 'LOINC'              # Deprecated LOINC code
      - 'MAP_TO'             # Current LOINC code
      - 'COMMENT'            # Mapping comment
      - 'ContentOrigin'      # Origin of mapping
      
    foreign_keys:
      'LOINC': 'Loinc.csv.LOINC_NUM'
      'MAP_TO': 'Loinc.csv.LOINC_NUM'

# Linguistic Variants (Multi-language support)
linguistic_files:
  pattern: 'LinguisticVariants/*.csv'
  description: 'Translation files for multiple languages'
  required: false
  
  expected_structure:
    filename_pattern: 'LinguisticVariants_*.csv'
    language_code_extraction: 'filename'  # Extract language from filename
    
  expected_columns:
    - 'LOINC_NUM'           # LOINC code reference
    - 'LONG_COMMON_NAME'    # Translated long name
    - 'SHORTNAME'           # Translated short name
    - 'Language'            # Language code
    - 'Country'             # Country code (optional)
    
  validation_rules:
    foreign_keys:
      'LOINC_NUM': 'Loinc.csv.LOINC_NUM'
    language_codes: ['es', 'fr', 'de', 'it', 'pt', 'zh', 'ja', 'ko', 'ru']

# Files Deferred to Later Phases
deferred_files:
  
  # Phase 2: Enrichment
  phase2_files:
    - 'LoincPartLink_Primary.csv'        # Multi-axial Part mappings
    - 'LoincPartLink_Supplementary.csv'  # Extended Part mappings  
    - 'PartRelatedCodeMapping.csv'       # External terminology mappings
    
  # Phase 3: Other Features
  phase3_files:
    - 'ConsumerName.csv'                 # Consumer-friendly names
    - 'Group*.csv'                       # LOINC Groups (not supported in OCL yet)
    - 'DocumentOntology.csv'             # Document ontology
    - 'RadiologyPlaybook.csv'            # Radiology-specific content

# File Processing Configuration
processing_config:
  
  # Encoding settings
  encoding:
    default: 'utf-8'
    fallbacks: ['utf-8-sig', 'iso-8859-1', 'cp1252']
    
  # CSV parsing settings  
  csv_settings:
    delimiter: ','
    quotechar: '"'
    skipinitialspace: true
    na_values: ['', 'NULL', 'null', 'N/A', 'n/a', 'NA', 'na']
    
  # Memory management
  memory_settings:
    chunk_size: 10000       # For large file processing
    low_memory: false       # pandas low_memory setting
    dtype_optimization: true # Convert to categories where appropriate
    
  # Error handling
  error_handling:
    max_errors_per_file: 100
    continue_on_error: true
    log_error_samples: true
    error_sample_size: 5

# Cross-Reference Validation Rules
cross_reference_rules:
  
  # Foreign key validation
  foreign_key_validation:
    enabled: true
    strict_mode: false      # Don't fail on missing references
    
  # Referential integrity checks
  integrity_checks:
    - source_file: 'LoincAnswerListLink.csv'
      source_column: 'LOINC_NUM'
      target_file: 'Loinc.csv'
      target_column: 'LOINC_NUM'
      description: 'Answer list links must reference valid LOINC codes'
      
    - source_file: 'LoincAnswerListLink.csv'
      source_column: 'AnswerListId'
      target_file: 'AnswerList.csv'
      target_column: 'AnswerListId'
      description: 'Answer list links must reference valid answer lists'
      
    - source_file: 'PanelsAndForms.csv'
      source_column: 'ParentLoinc'
      target_file: 'Loinc.csv'
      target_column: 'LOINC_NUM'
      description: 'Panel parents must be valid LOINC codes'
      
    - source_file: 'PanelsAndForms.csv'
      source_column: 'ChildLoinc'
      target_file: 'Loinc.csv'
      target_column: 'LOINC_NUM'
      description: 'Panel children must be valid LOINC codes'

# Success Criteria for Phase 1
success_criteria:
  minimum_files_loaded: 3    # At least Loinc.csv, Part.csv, AnswerList.csv
  minimum_rows_loaded: 140000 # At least ~140K total rows across all files
  max_error_rate: 0.01       # Maximum 1% error rate
  required_validations_passed: ['primary_key', 'required_fields', 'foreign_keys']
